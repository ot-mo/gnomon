<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level checks</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 14px/1.5 monospace; }
  .ok { color: #7d7; } .bad { color: #f77; }
</style>
</head>
<body>
<pre id="out">Running…</pre>
<script type="module">
// Generates many dungeon levels and checks each can be finished (stairs, rooms, vault, keys
// reachable), then sanity-checks the monster and item art. Open with ?seeds=50&depths=20 to change
// the size. The levels are the legacy stack's (the fixture site under world tile 0, 0):
// generateDungeonLevel(seed, legacyParams(depth, seed)). tools/check-dungeons.mjs does the same in Node, and
// tools/check-content.mjs the art (test-world.html runs both in the browser).
import { generateDungeonLevel, validateDungeonLevel, legacyParams, LEGACY_GUARDIANS } from "./src/gen/dungeon.js";
import { templeFixture as buildTemple } from "./src/content/world/temple.js";
import { CREATURE_TYPES, canTalk } from "./src/creatures.js";
import { FLOOR_ART, WEAPONS, WEAPON_PALETTE, itemPalette, POTIONS, POTION_COLORS, RINGS, AMULETS, RELICS, makeRelic, itemName, itemInfo } from "./src/items.js";

const out = document.getElementById("out");
const params = new URLSearchParams(location.search);
const SEEDS = +params.get("seeds") || 50, DEPTHS = +params.get("depths") || 20;
const lines = [], failures = [];
let floors = 0, retries = 0, slowest = 0, totalMs = 0;
const features = { vaults: {}, locked: 0, monsters: 0, climbs: 0, stones: 0, gear: 0, strength: 0, potions: 0 };

// The temple (the legacy site's surface) is drawn by hand: check it has what the story needs.
for (const seed of [1, 2, 3]) {
  const t = buildTemple(seed);
  if (!t.creatures.some((n) => n.type === "maren") || !t.items.some((i) => i.kind === "cube") || !t.stairs || !t.spikes.size || !t.cubeWall?.length)
    failures.push(`temple (seed ${seed}) is missing something`);
}

for (let seed = 1; seed <= SEEDS; seed++) {
  for (let depth = 1; depth <= DEPTHS; depth++) {
    const t0 = performance.now();
    const p = legacyParams(depth, seed);
    const f = generateDungeonLevel(seed, p);
    const ms = performance.now() - t0;
    totalMs += ms; slowest = Math.max(slowest, ms); floors++;
    retries += f.attempts - 1;
    const problems = validateDungeonLevel(f, p);
    if (problems.length) failures.push(`seed ${seed} depth ${depth}: ${problems.join(", ")}`);
    features.vaults[f.vault.name] = (features.vaults[f.vault.name] || 0) + 1;
    if (f.rooms.some((r) => r.locked)) features.locked++;
    const monsters = f.creatures.filter((c) => !canTalk(c)), people = f.creatures.filter(canTalk);   // (one list since 0C)
    features.monsters += monsters.length;
    features.npcs = (features.npcs || 0) + people.length;
    if (f.secret) { features.secrets = (features.secrets || 0) + 1; features.secretWalls = (features.secretWalls || 0) + f.secretWalls.size; }
    features.elites = (features.elites || 0) + monsters.filter((m) => m.elite).length;
    const band = depth <= 5 ? "1-5" : depth <= 10 ? "6-10" : depth <= 15 ? "11-15" : "16-20";
    for (const m of monsters) { const b = (features.mix ||= {})[band] ||= {}; b[m.type] = (b[m.type] || 0) + 1; }
    features.climbs += f.rooms.filter((r) => r.climb).length;
    features.stones += f.rooms.filter((r) => r.stones).length;
    features.gear += f.items.filter((i) => i.kind === "weapon" || i.kind === "armour").length;
    features.strength += f.items.filter((i) => i.kind === "strength").length;
    features.hearts = (features.hearts || 0) + f.items.filter((i) => i.kind === "heart").length;
    features.potions += f.items.filter((i) => i.kind === "potion").length;
    features.jewels = (features.jewels || 0) + f.items.filter((i) => i.kind === "ring" || i.kind === "amulet").length;
    features.relics = (features.relics || 0) + f.items.filter((i) => i.kind === "relic?").length;
    features.shrines = (features.shrines || 0) + people.filter((n) => n.type === "shrine").length;
    // A guardian's floor: the guardian, its hall, and stairs in the hall's alcove.
    if (LEGACY_GUARDIANS[depth] && (!f.guardianHall || !monsters.some((m) => m.guardian === f.guardianHall.type) || !f.stairs))
      failures.push(`seed ${seed} depth ${depth}: guardian hall incomplete`);
  }
}

// Every piece of pixel art: rows the same width, every letter in its palette.
const artProblems = [];
const checkArt = (name, frames, palette) => {
  for (const frame of frames) {
    if (frame.length !== frames[0].length) artProblems.push(`${name}: frames differ in height`);
    for (const row of frame) {
      if (row.length !== frame[0].length) artProblems.push(`${name}: ragged row "${row}"`);
      for (const ch of row) if (ch !== " " && !palette[ch]) artProblems.push(`${name}: no palette entry for "${ch}"`);
    }
  }
};
for (const [name, t] of Object.entries(CREATURE_TYPES)) if (t.frames) checkArt(name, t.frames, t.palette);
for (const [name, w] of Object.entries(WEAPONS)) {
  checkArt(`held ${name}`, [w.held.art], WEAPON_PALETTE);
  if (!(w.held.pivot > 0 && w.held.pivot < 1)) artProblems.push(`held ${name}: pivot ${w.held.pivot}`);
}
const fakeGame = { potionColor: Object.fromEntries(Object.keys(POTIONS).map((k, i) => [k, i])), knownPotions: new Set() };
const samples = { potion: { kind: "potion", effect: "healing" }, weapon: { kind: "weapon", id: "mace", element: "fire" }, armour: { kind: "armour", id: "plate" },
                  key: { kind: "key" }, heart: { kind: "heart" }, strength: { kind: "strength" }, scroll: { kind: "scroll", effect: "fire" }, knife: { kind: "knife", count: 3 }, bomb: { kind: "bomb", count: 1 },
                  gold: { kind: "gold", amount: 5 }, cash: { kind: "cash", amount: 5 }, cube: { kind: "cube" }, quest: { kind: "quest", name: "skull" },
                  ring: { kind: "ring", id: "protection" }, amulet: { kind: "amulet", id: "life" } };
for (const [name, t] of Object.entries(CREATURE_TYPES)) if (t.talks && t.art) checkArt(`npc ${name}`, [t.art], t.palette);
for (const [kind, a] of Object.entries(FLOOR_ART)) checkArt(`floor ${kind}`, [a.art], itemPalette(fakeGame, samples[kind]));
if (Object.keys(POTIONS).length > POTION_COLORS.length) artProblems.push("more potion effects than colours");
// Every ring, amulet and relic: art, a name and a description.
for (const id of Object.keys(RINGS)) checkArt(`ring ${id}`, [FLOOR_ART.ring.art], itemPalette(fakeGame, { kind: "ring", id }));
for (const id of Object.keys(AMULETS)) checkArt(`amulet ${id}`, [FLOOR_ART.amulet.art], itemPalette(fakeGame, { kind: "amulet", id }));
for (const key of Object.keys(RELICS)) {
  const it = makeRelic(key);
  checkArt(`relic ${key}`, [FLOOR_ART[it.kind].art], itemPalette(fakeGame, it));
  if (!itemName(fakeGame, it) || !itemInfo(fakeGame, it)) artProblems.push(`relic ${key}: no name or info`);
}

lines.push(`<span class="${failures.length ? "bad" : "ok"}">${floors - failures.length}/${floors} floors pass</span>` +
  ` · ${retries} regenerations · avg ${(totalMs / floors).toFixed(1)} ms, slowest ${slowest.toFixed(1)} ms`);
lines.push(`vaults: ${JSON.stringify(features.vaults)} · locked rooms: ${features.locked} · ` +
  `monsters: ${(features.monsters / floors).toFixed(1)} per floor`);
lines.push(`platforming: ${features.climbs} climb rooms, ${features.stones} stepping-stone halls · per floor: ` +
  `${(features.potions / floors).toFixed(1)} potions, ${(features.gear / floors).toFixed(1)} gear, ${(features.strength / floors).toFixed(2)} strength crystals, ${(features.hearts / floors).toFixed(2)} heart crystals`);
lines.push(`rings and amulets: ${((features.jewels || 0) / floors).toFixed(2)} per floor · relic spots: ${features.relics || 0} · shrines: ${features.shrines || 0}`);
lines.push(`people: ${features.npcs} · elites: ${features.elites} of ${features.monsters} monsters · secret rooms: ${features.secrets || 0} of ${floors} floors ` +
  `(${((features.secretWalls || 0) / Math.max(1, features.secrets || 0)).toFixed(2)} ways in each)`);
for (const [band, mix] of Object.entries(features.mix || {}))
  lines.push(`  depths ${band}: ` + Object.entries(mix).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${t} ${n}`).join(", "));
lines.push(`<span class="${artProblems.length ? "bad" : "ok"}">art: ${artProblems.length ? artProblems.join("; ") : "ok"}</span>`);
if (failures.length) lines.push("", ...failures.slice(0, 40));
out.innerHTML = lines.join("\n");
window.testResult = { floors, failures, retries, artProblems };
</script>
</body>
</html>
